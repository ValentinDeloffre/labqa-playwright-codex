name: Playwright E2E

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  regression:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run typecheck
      - run: npm run test:smoke
      - run: npm run test:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  known-bugs:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:known-bugs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: known-bugs-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  probes:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:probes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probes-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
